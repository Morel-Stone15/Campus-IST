<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus+ · IST</title>
  <meta name="description" content="Campus+ : tout ton campus IST dans une seule application.">
  <meta name="theme-color" content="#0A4EA3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Applique le thème choisi avant l'affichage pour éviter un flash de couleur.
    try { var t = JSON.parse(localStorage.getItem('istc_theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Campus+ a besoin de JavaScript pour fonctionner.</p></noscript>

  <script src="js/config.js"></script>
  <!-- ── URL de l'API Render (modifier si le nom du service change) ────────
       Cette variable est lue par js/api.js avant de déterminer l'URL de l'API.
       Si vous hébergez l'API ailleurs, changez cette valeur.
       Si le frontend et le backend sont sur le même serveur, laissez commenté. -->
  <script>
    // URL de l'API Campus+ sur Render (utilisée uniquement depuis GitHub Pages)
    window.CAMPUS_API_URL = 'https://campus-ist.onrender.com/api/v1';
  </script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/academic.js"></script>
  <script src="js/pages/documents.js"></script>
  <script src="js/pages/news.js"></script>
  <script src="js/pages/agenda.js"></script>
  <script src="js/pages/services.js"></script>
  <script src="js/pages/map.js"></script>
  <script src="js/pages/identity.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/pages/classes.js"></script>
  <script src="js/pages/filiere.js"></script>
  <script src="js/pages/personnel.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
